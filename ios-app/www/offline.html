<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sin conexión</title>
<style>
  :root { color-scheme: light dark; --bg:#FCFCFB; --fg:#17130E; --muted:#5B5246; --brand:#1D4FB8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111111; --fg:#F4F1EA; --muted:#B9B0A2; --brand:#7FA6FF; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:32px 28px calc(32px + env(safe-area-inset-bottom)); box-sizing:border-box; max-width:420px; margin:0 auto; }
  .bar { display:flex; height:6px; border-radius:3px; overflow:hidden; width:96px; margin-bottom:28px; }
  .bar i { flex:1 } h1 { font-size:26px; line-height:1.15; margin:0 0 12px; letter-spacing:-.4px }
  p { color:var(--muted); font-size:17px; line-height:1.45; margin:0 0 28px }
  button { appearance:none; border:0; border-radius:14px; background:var(--brand); color:#fff; font:600 17px -apple-system,system-ui,sans-serif; padding:15px 22px; min-height:50px }
</style>
</head>
<body>
<main>
  <div class="bar"><i style="background:#1F5FAD"></i><i style="background:#D9A520"></i><i style="background:#D0283B"></i></div>
  <h1>No hay conexión</h1>
  <p>Revisá el wifi o los datos del celular. Cuando vuelva la señal, tocá para seguir donde estabas.</p>
  <button onclick="location.href='https://www.comunidadlatina.com/feed?origen=ios'">Reintentar</button>
</main>
</body>
</html>
